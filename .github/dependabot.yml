# Version-update PRs disabled to preserve dev → staging → main.
# Registry, compiler compatibility and reviewed update metadata retained.
# Security alerts/scans stay enabled; security-fix PR control is separate.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
  groups:
    compatible-actions:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: npm
  directory: /onesa-ai-robot-frontend
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
  groups:
    compatible-packages:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: pip
  directory: /onesa-ai-robot-backend
  schedule:
    interval: monthly
  open-pull-requests-limit: 0
  groups:
    compatible-python:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
