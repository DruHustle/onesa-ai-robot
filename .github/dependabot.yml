# Ordinary version-update PRs remain disabled; their retained target is dev.
# Authorized security PRs use the repository default main, independently of target-branch.
# Registry, compiler compatibility and reviewed update metadata retained.
# Security-update PRs are enabled separately and target the default main branch.
version: 2
updates:
- package-ecosystem: github-actions
  directory: /
  schedule:
    interval: monthly
  target-branch: dev
  open-pull-requests-limit: 0
  groups:
    compatible-actions:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: npm
  directory: /onesa-ai-robot-frontend
  schedule:
    interval: monthly
  target-branch: dev
  open-pull-requests-limit: 0
  groups:
    compatible-packages:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
- package-ecosystem: pip
  directory: /onesa-ai-robot-backend
  schedule:
    interval: monthly
  target-branch: dev
  open-pull-requests-limit: 0
  groups:
    compatible-python:
      applies-to: version-updates
      patterns:
      - '*'
      update-types:
      - minor
      - patch
  cooldown:
    default-days: 7
