name: Pipeline static security
'on':
  workflow_call: {}
permissions:
  contents: read
jobs:
  workflow-security:
    if: (github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true') && (success())
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Install checksum-locked local analysis tools
      run: python3 scripts/ci/install_tools.py --only actionlint zizmor gitleaks reviewdog
    - name: 'Release requirement: workflow and secret security'
      run: python3 scripts/ci/security.py --output "$RUNNER_TEMP/pipeline-security/record.json"
    - name: 'Release requirement: pipeline negative tests'
      run: python3 -m unittest discover -s scripts/ci -p 'test_*.py'
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      if: always()
      with:
        name: pipeline-security
        path: ${{ runner.temp }}/pipeline-security/record.json
        retention-days: 3
        if-no-files-found: error
