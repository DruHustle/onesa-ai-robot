name: Release qualification evidence
'on':
  workflow_dispatch:
    inputs:
      staging_run:
        description: Optional exact-candidate successful release-staging run ID
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: release-qualification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  qualify:
    if: always() && (github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true') && (always() && true && (github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository && github.event.workflow_run.head_sha == github.sha))))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Generate observed technical evidence
      env:
        GH_TOKEN: ${{ github.token }}
        STAGING_RUN: ${{ inputs.staging_run }}
      run: python3 scripts/release/evidence.py generate --output "$RUNNER_TEMP/qualification/record.json"
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-qualification
        path: ${{ runner.temp }}/qualification/record.json
        retention-days: 7
        if-no-files-found: error
