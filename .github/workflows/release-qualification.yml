name: Release qualification evidence
'on':
  workflow_run:
    workflows:
    - Robot software verification
    - Repository hygiene
    - Reviewed production frontend build
    - Robot staging deployment
    types:
    - completed
    branches:
    - main
  workflow_dispatch:
    inputs:
      staging_run:
        description: Optional exact-candidate successful release-staging run ID
        type: string
        required: false
permissions:
  contents: read
  actions: read
concurrency:
  group: release-qualification-${{ github.sha }}
  cancel-in-progress: false
jobs:
  qualify:
    if: always() && (github.event.repository.private == false || needs.local-validation.result == 'success') && (github.repository == 'DruHustle/onesa-ai-robot'
      && github.actor == 'DruHustle' && (github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name
      == github.repository && github.event.workflow_run.head_sha == github.sha)))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Generate observed technical evidence
      env:
        GH_TOKEN: ${{ github.token }}
        STAGING_RUN: ${{ inputs.staging_run }}
      run: python3 scripts/release/evidence.py generate --output "$RUNNER_TEMP/qualification/record.json"
    - uses: actions/upload-artifact@v4
      with:
        name: release-qualification
        path: ${{ runner.temp }}/qualification/record.json
        retention-days: 7
        if-no-files-found: error
    needs: local-validation
  local-validation:
    if: github.event.repository.private == true && github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle'
    uses: ./.github/workflows/_local-validation.yml
