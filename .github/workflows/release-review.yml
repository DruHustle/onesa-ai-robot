name: Owner release review
'on':
  workflow_dispatch:
    inputs:
      qualification_run:
        description: Exact qualification run reviewed
        type: string
        required: true
      evidence_digest:
        description: Canonical JSON SHA256 from qualification summary
        type: string
        required: true
      decision:
        description: Approve production or revoke a prior approval
        type: choice
        options:
        - revoke
        - approve
        default: revoke
        required: true
      operations_review:
        description: Owner reviewed monitoring, alerts, recovery, limits, worker, rollback evidence
        type: choice
        options:
        - blocked
        - approved
        default: blocked
        required: true
      legal_review:
        description: Owner explicitly approves candidate content/legal/business version
        type: choice
        options:
        - blocked
        - approved
        default: blocked
        required: true
      review_url:
        description: Open owner-authored repository issue/PR documenting reviewed evidence
        type: string
        required: true
permissions:
  contents: read
  actions: read
  issues: read
concurrency:
  group: robot-cloud-deployment
  cancel-in-progress: false
jobs:
  review:
    if: always() && true && (github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && github.ref
      == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - name: Validate evidence and record explicit owner decision
      env:
        GH_TOKEN: ${{ github.token }}
        QUALIFICATION_RUN: ${{ inputs.qualification_run }}
        EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
        REVIEW_DECISION: ${{ inputs.decision }}
        OPERATIONS_REVIEW: ${{ inputs.operations_review }}
        LEGAL_REVIEW: ${{ inputs.legal_review }}
        REVIEW_URL: ${{ inputs.review_url }}
      run: python3 scripts/release/evidence.py review --output "$RUNNER_TEMP/approval/record.json"
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: release-approval
        path: ${{ runner.temp }}/approval/record.json
        retention-days: 7
        if-no-files-found: error
