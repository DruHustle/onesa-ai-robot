name: Robot edge simulation software package
'on':
  workflow_dispatch:
    inputs:
      licensing_review:
        description: Owner approves distribution of this exact simulation candidate
        type: choice
        options:
        - blocked
        - approved
        default: blocked
        required: true
      review_issue:
        description: Open owner-authored issue recording candidate distribution review
        type: string
        required: true
permissions:
  contents: read
  actions: read
  issues: read
jobs:
  package:
    if: github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && github.ref == 'refs/heads/main'
      && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Require complete exact-candidate checks
      env:
        GH_TOKEN: ${{ github.token }}
        EDGE_LICENSE_REVIEW: ${{ inputs.licensing_review }}
        EDGE_REVIEW_ISSUE: ${{ inputs.review_issue }}
      run: python3 scripts/release/evidence.py edge-preflight --output "$RUNNER_TEMP/edge/preflight.json"
    - name: Package simulation software and ROS interface sources
      run: 'docker build -t "onesa-robot-edge-simulation:$GITHUB_SHA" onesa-ai-robot-backend

        mkdir -p data/security

        chmod 700 data/security

        docker save "onesa-robot-edge-simulation:$GITHUB_SHA" -o data/security/runtime.tar

        docker run --rm --user "$(id -u):$(id -g)" -e TRIVY_CACHE_DIR=/tmp/trivy-cache -v "$PWD/data/security:/reports" aquasec/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
        image --scanners vuln,secret --format json --output /reports/runtime.json --input /reports/runtime.tar

        python3 scripts/image_gate.py data/security/runtime.json

        docker save "onesa-robot-edge-simulation:$GITHUB_SHA" -o "$RUNNER_TEMP/edge/simulator.tar"

        tar -cf "$RUNNER_TEMP/edge/interfaces.tar" ros2/onesa_sim_interfaces ros2/README.md edge/simulation-agent.py

        python3 scripts/release/edge-manifest.py "$RUNNER_TEMP/edge"

        '
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: robot-edge-simulation-${{ github.sha }}
        path: '${{ runner.temp }}/edge/simulator.tar

          ${{ runner.temp }}/edge/interfaces.tar

          ${{ runner.temp }}/edge/record.json

          '
        if-no-files-found: error
        retention-days: 7
