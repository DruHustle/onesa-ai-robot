name: Repository hygiene
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  publication-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python scripts/repository_hygiene.py --history
