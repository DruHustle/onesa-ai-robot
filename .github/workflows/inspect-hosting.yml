name: Inspect Robot hosting configuration
'on':
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: robot-owner-hosting-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: (github.event.repository.private == false || vars.ONESA_PRIVATE_HOSTED_VALIDATION_ENABLED == 'true') && (github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Verify current repository visibility before credential access
      env:
        GH_TOKEN: ${{ github.token }}
      run: test "$(gh api repos/DruHustle/onesa-ai-robot --jq '.private')" = false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Read existing provider configuration without exposing values
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: python3 scripts/inspect_hosting.py
