name: Inspect Robot hosting configuration
'on':
  workflow_dispatch:
    inputs:
      secret_scope:
        description: Read providers or test only staging secret availability
        type: choice
        default: providers
        options: [providers, environment, repository]
permissions:
  contents: read
concurrency:
  group: robot-owner-hosting-inspection
  cancel-in-progress: false
jobs:
  inspect:
    if: inputs.secret_scope == 'providers' && github.event_name == 'workflow_dispatch' && github.event.repository.private == false && github.repository == 'DruHustle/onesa-ai-robot'
      && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
    - name: Verify current repository visibility before credential access
      env:
        GH_TOKEN: ${{ github.token }}
      run: test "$(gh api repos/DruHustle/onesa-ai-robot --jq '.private')" = false
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: ${{ github.sha }}
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.11'
    - name: Read existing provider configuration without exposing values
      env:
        RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
        VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      run: python3 scripts/inspect_hosting.py
  staging-environment-availability:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging') && inputs.secret_scope == 'environment'
    environment: Staging
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Report only required staging secret availability
      env:
        STAGING_SECRET_SCOPE: environment
        STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        STAGING_RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        STAGING_ROBOT_EDGE_TOKEN: ${{ secrets.STAGING_ROBOT_EDGE_TOKEN }}
        STAGING_ROBOT_TEST_PASSWORD: ${{ secrets.STAGING_ROBOT_TEST_PASSWORD }}
        STAGING_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
      run: |
        node <<'NODE'
        const names=["STAGING_RENDER_API_KEY", "STAGING_RENDER_SERVICE_ID", "STAGING_ROBOT_EDGE_TOKEN", "STAGING_ROBOT_TEST_PASSWORD", "STAGING_VERCEL_AUTOMATION_BYPASS_SECRET", "STAGING_VERCEL_ORG_ID", "STAGING_VERCEL_PROJECT_ID", "STAGING_VERCEL_TOKEN"];
        const available=Object.fromEntries(names.map(name=>[name,Boolean(process.env[name])]));
        const all=Object.values(available).every(Boolean);
        console.log(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,scope:process.env.STAGING_SECRET_SCOPE,available,all_available:all,values_disclosed:false,provider_requests:false}));
        if(!all) process.exitCode=1;
        NODE
  staging-repository-availability:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && github.triggering_actor == 'DruHustle' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/staging') && inputs.secret_scope == 'repository'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
    - name: Report only required staging secret availability
      env:
        STAGING_SECRET_SCOPE: repository
        STAGING_RENDER_API_KEY: ${{ secrets.STAGING_RENDER_API_KEY }}
        STAGING_RENDER_SERVICE_ID: ${{ secrets.STAGING_RENDER_SERVICE_ID }}
        STAGING_ROBOT_EDGE_TOKEN: ${{ secrets.STAGING_ROBOT_EDGE_TOKEN }}
        STAGING_ROBOT_TEST_PASSWORD: ${{ secrets.STAGING_ROBOT_TEST_PASSWORD }}
        STAGING_VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.STAGING_VERCEL_AUTOMATION_BYPASS_SECRET }}
        STAGING_VERCEL_ORG_ID: ${{ secrets.STAGING_VERCEL_ORG_ID }}
        STAGING_VERCEL_PROJECT_ID: ${{ secrets.STAGING_VERCEL_PROJECT_ID }}
        STAGING_VERCEL_TOKEN: ${{ secrets.STAGING_VERCEL_TOKEN }}
      run: |
        node <<'NODE'
        const names=["STAGING_RENDER_API_KEY", "STAGING_RENDER_SERVICE_ID", "STAGING_ROBOT_EDGE_TOKEN", "STAGING_ROBOT_TEST_PASSWORD", "STAGING_VERCEL_AUTOMATION_BYPASS_SECRET", "STAGING_VERCEL_ORG_ID", "STAGING_VERCEL_PROJECT_ID", "STAGING_VERCEL_TOKEN"];
        const available=Object.fromEntries(names.map(name=>[name,Boolean(process.env[name])]));
        const all=Object.values(available).every(Boolean);
        console.log(JSON.stringify({repository:process.env.GITHUB_REPOSITORY,scope:process.env.STAGING_SECRET_SCOPE,available,all_available:all,values_disclosed:false,provider_requests:false}));
        if(!all) process.exitCode=1;
        NODE
