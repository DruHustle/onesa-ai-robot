name: Robot candidate packaging (simulation only)
on:
  workflow_dispatch:
    inputs:
      application:
        description: Application to package after implementation
        type: choice
        options: [frontend, backend]
        required: true
permissions:
  contents: read
  checks: read
jobs:
  local-validation:
    if: ${{ github.event.repository.private == true && github.repository == 'DruHustle/onesa-ai-robot' && github.actor == 'DruHustle' && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.user.login == 'DruHustle')) }}
    uses: ./.github/workflows/_local-validation.yml
  candidate:
    needs: local-validation
    if: ${{ always() && (github.event.repository.private == false || needs.local-validation.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - name: Verify GitHub-hosted execution and actual visibility
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_PRIVATE: ${{ github.event.repository.private }}
        run: |
          test "$RUNNER_ENVIRONMENT" = github-hosted
          actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq '.private')
          test "$actual" = "$EXPECTED_PRIVATE" || { echo 'Repository visibility changed; start fresh validation'; exit 1; }
      - uses: actions/checkout@v4
      - name: Require implemented application build context
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          if ! test -f "onesa-ai-robot-${APPLICATION}/Dockerfile"; then
            echo 'Application not implemented. No candidate can be packaged.'
            exit 1
          fi
      - name: Require exact-revision software and publication checks
        uses: actions/github-script@v7
        with:
          script: |
            const checks = await github.paginate(github.rest.checks.listForRef, {
              ...context.repo, ref: context.sha, per_page: 100
            });
            for (const name of ['backend', 'frontend', 'containers (frontend)', 'containers (backend)', 'publication-hygiene']) {
              const check = checks.filter(item => item.name === name).sort((a, b) => b.id - a.id)[0];
              if (!check || check.conclusion !== 'success') core.setFailed(`Required successful check missing: ${name}`);
            }
      - name: Package selected application without publication
        env:
          APPLICATION: ${{ inputs.application }}
        run: |
          docker build -t "onesa-robot-${APPLICATION}:${GITHUB_SHA}" "onesa-ai-robot-${APPLICATION}"
          docker save "onesa-robot-${APPLICATION}:${GITHUB_SHA}" -o candidate.tar
      - uses: actions/upload-artifact@v4
        with:
          name: robot-${{ inputs.application }}-${{ github.sha }}
          path: candidate.tar
          retention-days: 7
# Packaging never authorizes public promotion or physical operation.
