name: Robot candidate packaging (simulation only)
'on':
  workflow_dispatch:
    inputs:
      application:
        description: Application to package after implementation
        type: choice
        options:
        - frontend
        - backend
        required: true
permissions:
  contents: read
  checks: read
jobs:
  candidate:
    if: ${{ always() && true }}
    runs-on: ubuntu-latest
    steps:
    - name: Verify GitHub-hosted execution and actual visibility
      env:
        GH_TOKEN: ${{ github.token }}
        EXPECTED_PRIVATE: ${{ github.event.repository.private }}
      run: 'test "$RUNNER_ENVIRONMENT" = github-hosted

        actual=$(gh api "repos/$GITHUB_REPOSITORY" --jq ''.private'')

        test "$actual" = "$EXPECTED_PRIVATE" || { echo ''Repository visibility changed; start fresh validation''; exit 1;
        }

        '
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        persist-credentials: false
    - name: Require implemented application build context
      env:
        APPLICATION: ${{ inputs.application }}
      run: "if ! test -f \"onesa-ai-robot-${APPLICATION}/Dockerfile\"; then\n  echo 'Application not implemented. No candidate\
        \ can be packaged.'\n  exit 1\nfi\n"
    - name: Require exact-revision software and publication checks
      uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
      with:
        script: "const checks = await github.paginate(github.rest.checks.listForRef, {\n  ...context.repo, ref: context.sha,\
          \ per_page: 100\n});\nfor (const name of ['backend', 'frontend', 'containers (frontend)', 'containers (backend)',\
          \ 'publication-hygiene']) {\n  const check = checks.filter(item => item.name === name).sort((a, b) => b.id - a.id)[0];\n\
          \  if (!check || check.conclusion !== 'success') core.setFailed(`Required successful check missing: ${name}`);\n\
          }\n"
    - name: Package selected application without publication
      env:
        APPLICATION: ${{ inputs.application }}
      run: 'docker build -t "onesa-robot-${APPLICATION}:${GITHUB_SHA}" "onesa-ai-robot-${APPLICATION}"

        docker save "onesa-robot-${APPLICATION}:${GITHUB_SHA}" -o candidate.tar

        '
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
      with:
        name: robot-${{ inputs.application }}-${{ github.sha }}
        path: candidate.tar
        retention-days: 7
    timeout-minutes: 30
