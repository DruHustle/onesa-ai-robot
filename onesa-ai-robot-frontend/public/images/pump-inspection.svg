<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="scene-title scene-desc"><title id="scene-title">Pump P-101 inspection scene</title><desc id="scene-desc">Illustrative pump, inspection position and software robot. The robot joint is calculated by the simulator. The drawing is not validated physics.</desc><style>:root{--onesa-surface:#f5f7fa;--onesa-canvas:#fff;--onesa-border:#6e7d90;color:#56677b}.scene-floor{fill:var(--onesa-canvas);stroke:var(--onesa-border)}.scene-label{fill:#10263e;font:700 18px sans-serif}.scene-small{fill:#56677b;font:12px sans-serif;letter-spacing:1px}@media(prefers-color-scheme:dark){:root{--onesa-surface:#14243a;--onesa-canvas:#0b1523;--onesa-border:#7592ac;color:#b4c4d6}.scene-label{fill:#e5edf6}.scene-small{fill:#b4c4d6}}</style><defs><pattern id="scene-grid" width="38" height="38" patternUnits="userSpaceOnUse"><path d="M38 0H0V38" fill="none" stroke="currentColor" stroke-opacity=".12"/></pattern><linearGradient id="pump-metal" x2=".3" y2="1"><stop stop-color="#94a3b8"/><stop offset="1" stop-color="#334155"/></linearGradient></defs><rect width="760" height="380" fill="var(--onesa-surface)"/><path d="M0 140 380 0l380 140v240H0Z" fill="url(#scene-grid)"/><path d="m60 275 340-112 310 113-330 93Z" class="scene-floor"/><path d="M354 244h247v27H354Z" fill="#334155"/><path d="m432 211-63-13-19 29 72 17 52-11" fill="url(#pump-metal)"/><rect x="478" y="180" width="106" height="62" rx="18" fill="url(#pump-metal)"/><path d="M496 185v51m14-51v51m14-51v51m14-51v51m14-51v51m14-51v51" stroke="#cbd5e1" stroke-opacity=".5" stroke-width="3"/><circle cx="445" cy="212" r="43" fill="url(#pump-metal)" stroke="#b6d5d8" stroke-width="3"/><circle cx="445" cy="212" r="19" fill="#152c33" stroke="#5eead4" stroke-width="3"/><path d="M443 168v-38h70v-22m-110 107h-56v-40" stroke="#78999c" stroke-width="16" fill="none"/><circle cx="442" cy="145" r="14" fill="#e2e8f0" stroke="#334155" stroke-width="4"/><path d="m442 145 6-6" stroke="#334155" stroke-width="2"/><text x="514" y="156" class="scene-label">P-101</text><ellipse cx="279" cy="286" rx="60" ry="20" fill="none" stroke="#14b8a6" stroke-dasharray="6 6"/><text x="160" y="335" class="scene-small">Inspection position</text><path d="M206 261h69l15 22h-99Z" fill="#164e63" stroke="#5eead4" stroke-width="2"/><circle cx="208" cy="284" r="10" fill="#0f172a"/><circle cx="270" cy="284" r="10" fill="#0f172a"/><g id="scene-joint"><path d="M239 258v-68l53-25" fill="none" stroke="#2dd4bf" stroke-width="15" stroke-linejoin="round"/><circle cx="239" cy="221" r="11" fill="#0f172a" stroke="#99f6e4" stroke-width="3"/><rect x="286" y="150" width="30" height="23" rx="5" fill="#164e63" stroke="#99f6e4" stroke-width="2"/></g><path d="m318 165 85 24" stroke="#2dd4bf" stroke-dasharray="4 7" opacity=".6"/><text x="28" y="32" class="scene-small">CPU SIMULATION / ORIGINAL ILLUSTRATION</text><text id="scene-position" x="28" y="360" class="scene-small">Illustrative inspection position</text><text x="570" y="360" class="scene-small">NO HARDWARE</text></svg>
